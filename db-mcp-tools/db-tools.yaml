tools:
  - name: get_bytedance_video_message_context_by_id
    description: 根据主键 ID 查询字节视频短信发送上下文单条记录
    sql: |
      SELECT id, user_id, msg_id, platform_msg_id, bytedance_template_id,
             platform_template_id, mobile, ext_code, ext, remarks,
             callback_url, vendor, template_param, status,
             receive_time, create_time, update_time
      FROM inter_gsms.bytedance_video_message_context
      WHERE id = #{id}
      LIMIT 1
    properties:
      id:
        type: integer
        description: bytedance_video_message_context 主键 ID
    required:
      - id

  - name: count_bytedance_video_message_context
    description: 统计字节视频短信发送上下文记录总量
    sql: |
      SELECT COUNT(*) AS total
      FROM inter_gsms.bytedance_video_message_context
    properties: {}
    required: []

  - name: get_bytedance_video_template_mapping_by_id
    description: 根据主键 ID 查询字节视频短信模板映射单条记录
    sql: |
      SELECT id, user_id, bytedance_template_id, platform_template_id,
             template_subject, signature, callback_url, remarks, ext,
             preview_url, vendor, variable_names, expire_time,
             audit_desc, status, create_time, update_time
      FROM inter_gsms.bytedance_video_template_mapping
      WHERE id = #{id}
      LIMIT 1
    properties:
      id:
        type: integer
        description: bytedance_video_template_mapping 主键 ID
    required:
      - id

  - name: count_bytedance_video_template_mapping
    description: 统计字节视频短信模板映射记录总量
    sql: |
      SELECT COUNT(*) AS total
      FROM inter_gsms.bytedance_video_template_mapping
    properties: {}
    required: []

  - name: get_bytedance_video_retry_task_by_id
    description: 根据主键 ID 查询字节视频短信回调重试任务单条记录
    sql: |
      SELECT id, data, retry_time, retry_count, status, create_time
      FROM inter_gsms.bytedance_video_retry_task
      WHERE id = #{id}
      LIMIT 1
    properties:
      id:
        type: integer
        description: bytedance_video_retry_task 主键 ID
    required:
      - id

  - name: count_bytedance_video_retry_task
    description: 统计字节视频短信回调重试任务记录总量
    sql: |
      SELECT COUNT(*) AS total
      FROM inter_gsms.bytedance_video_retry_task
    properties: {}
    required: []
  - name: total_count
    description: 增加一个看下是否支持动态的MCP Tools
    sql: |
      select count(*) from inter_gsms.bytedance_video_retry_task
    properties: {}
    required: []
