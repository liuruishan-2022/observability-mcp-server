[package]
name = "observability-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["macros"] }
chrono = "0.4.42"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "std",
    "fmt",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
reqwest = { version = "0.12.23", features = ["json", "multipart"] }
thiserror = "2.0.17"

# MCP server
rmcp = { version = "1.7.0", features = [
    "server",
    "macros",
    "transport-io",
    "client",
    "transport-streamable-http-server",
] }

# Schemas
schemars = "1.2.1"

# Tokio utilities
tokio-util = "0.7.18"

# Environment variables
dotenv = "0.15.0"

# Base64 encoding
base64 = "0.22.0"
pulldown-cmark = "0.13.0"

# Kubernetes client
kube = { version = "0.98.0", features = ["client", "runtime", "ws"] }
k8s-openapi = { version = "0.24.0", features = ["v1_32"] }
tokio-tungstenite = "0.26.0"
dirs = "5.0.0"

# Kafka client
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "tokio"] }
uuid = { version = "1.12.0", features = ["v4"] }

# SQLx for database operations (Doris uses MySQL protocol)
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
