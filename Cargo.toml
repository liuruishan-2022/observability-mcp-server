[workspace]
resolver = "3"
members = [
    "observability-mcp-tools",
    "db-mcp-tools",
]

[profile.release]
panic = "abort"
codegen-units = 1
strip = true
lto = true
opt-level = 1

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["macros"] }
chrono = "0.4.42"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "std",
    "fmt",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
reqwest = { version = "0.12.23", features = ["json", "multipart"] }
thiserror = "2.0.17"
rmcp = { version = "1.7.0", features = [
    "server",
    "macros",
    "transport-io",
    "client",
    "transport-streamable-http-server",
] }
schemars = "1.2.1"
tokio-util = "0.7.18"
dotenv = "0.15.0"
base64 = "0.22.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.0"
kube = { version = "0.98.0", features = ["client", "runtime", "ws"] }
k8s-openapi = { version = "0.24.0", features = ["v1_32"] }
tokio-tungstenite = "0.26.0"
dirs = "5.0.0"
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "tokio"] }
uuid = { version = "1.12.0", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
