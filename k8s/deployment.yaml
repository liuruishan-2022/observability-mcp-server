---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-mcp-server-cm
  namespace: monitoring
data:
  PROMETHEUS_ROOT: 'http://prometheus.monitoring:9090'
  LOKI_ROOT: 'http://loki.logs:3100'
  DORIS_URL: 'mysql://root:Sedp@2025@172.16.1.133:9030/sedp_test'
  DORIS_HTTP_URL: 'http://172.16.1.133:8030'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-mcp-server
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-mcp-server
      version: v0.1.0
  template:
    metadata:
      labels:
        app: observability-mcp-server
        version: v0.1.0
    spec:
      containers:
        - image: xwharbor.wxchina.com/cpaas/component/observability-mcp-server:v0.1.0-8094a852b6
          name: observability-mcp-server
          env:
            - name: PROMETHEUS_ROOT
              valueFrom:
                configMapKeyRef:
                  name: observability-mcp-server-cm
                  key: PROMETHEUS_ROOT
            - name: LOKI_ROOT
              valueFrom:
                configMapKeyRef:
                  name: observability-mcp-server-cm
                  key: LOKI_ROOT
            - name: DORIS_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-mcp-server-cm
                  key: DORIS_URL
            - name: DORIS_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-mcp-server-cm
                  key: DORIS_HTTP_URL
          ports:
            - containerPort: 3013
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: '2'
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - mountPath: /etc/localtime
              name: date-config
      volumes:
        - hostPath:
            path: /etc/localtime
          name: date-config

---
apiVersion: v1
kind: Service
metadata:
  name: observability-mcp-server-svc
  namespace: monitoring
spec:
  selector:
    app: observability-mcp-server
    version: v0.1.0
  ports:
    - name: http
      port: 3013
      targetPort: 3013
      protocol: TCP
  type: ClusterIP
